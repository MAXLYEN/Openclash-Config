;Openclash-Config
;VERSION: 1.x（已停止维护）
;此文件已由 Custom_Clash_V2.ini 取代，仅为兼容既有订阅链接保留。
;新配置请使用 dist/Custom_Clash_V2.ini，不要在此文件上做修改。
;规则库：https://github.com/MAXLYEN/Openclash-Rule

;【规则顺序】从上到下遍历，命中即止。带"必须排在…之前"注释的行存在顺序依赖，调整位置前请先读该注释
;【GeoSite/GeoIP】平台类一律排在同组 .list 之后，仅作兜底补漏，由本地 list 主导匹配
;  例外（保持前置）：private 内网 / 国内直连类(google-cn、games@cn、游戏平台下载、公共 tracker) / gfw 与 cn 全局兜底
;【规则源】raw+3600 用于金融、AI、私人定制（需即时生效）；jsdelivr+28800 用于其余公共规则
;  jsdelivr 有 CDN 缓存，强制刷新：https://purge.jsdelivr.net/gh/MAXLYEN/Openclash-Rule@main/rules/文件名.list
;【分组归属】文件名与分组名对应则用专属分组；仅共用地区节点则归地区公共分组
;  美国→Optional 日本→Emby 新加坡→Google 香港→Proxy 菲律宾→Asia 欧洲→EUNet 英国→UKNet 澳洲→Oceania 南美→South America

[custom]
;══════ 置顶区：内网直连 ══════
;内网地址必须最先命中，不能被后续任何规则干预
ruleset=Global Direct,[]GEOSITE,private
ruleset=Global Direct,[]GEOIP,private,no-resolve

;══════ 自建服务 ══════
;自建域名必须先于所有公共规则集命中，避免被 Custom_Proxy / GFWlist 误抓
;默认直连；域名被墙时在面板切代理即可三秒恢复
;raw+3600：属私人定制，需即时生效
ruleset=Self-Hosted,clash-classic:https://raw.githubusercontent.com/MAXLYEN/Openclash-Rule/refs/heads/main/rules/yaml/SelfHosted_Domain.yaml,3600

;══════ 域名规则区 ══════
;本区全部为域名类规则（DOMAIN / DOMAIN-SUFFIX / DOMAIN-KEYWORD / GEOSITE）
;顺序原则：专属平台 → 泛分类 → 地区兜底 → gfw → 国内兜底
;GEOSITE 一律排在同组规则集之后，仅作兜底补漏
;带 ; 前缀的行为空占位规则集，文件已保留，补充内容后取消注释即可
