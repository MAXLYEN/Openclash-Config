;Custom_OpenClash_Rules
;VERSION: 2.6 (2026-09-06)
;规则库：https://github.com/MAXLYEN/Openclash-Rule
;变更记录见本项目 CHANGELOG.md
;
;【三层架构】
;  Layer 0 节点池(url-test)  🇭🇰/🇯🇵/🇸🇬/🇺🇸/🇬🇧/🇩🇪/🇦🇺/🇧🇷  ← 唯一跟机场节点名打交道的一层
;  Layer 1 地区锚点(select)  Proxy(HK) USNet JPNet SGNet UKNet EUNet AUNet BRNet
;                            第一候选恒为对应节点池，全新配置无需手选
;  Layer 2 平台组(select)    候选只放锚点组，第一个 = 该平台默认地区
;  改一个地区的出口只需动 Layer 1；平台组不碰具体节点
;
;【地区意图】
;  Proxy=香港(通用/低延迟)  USNet=美国(流媒体+AI)  SGNet=新加坡(亚洲金融/虚拟币)
;  JPNet=日本(含无专用节点地区的挂靠，如菲律宾)  UKNet=英国(仅本地服务)  EUNet=欧洲
;  AUNet=大洋洲  BRNet=南美
;
;【规则顺序】从上到下遍历，命中即止
;  总原则：平台维度在前，地区维度在后，ccTLD 与 gfw/cn 兜底垫底
;  地区文件(US/SG/UKNet/EUNet/JP/HK)一律排在平台专属之后，否则会吃掉平台组
;【GeoSite/GeoIP】平台类排在同组 .list 之后，仅作兜底补漏
;【规则源】两个 CDN 厂商互为冗余，底层都是 jsdelivr：
;  fastly.jsdelivr.net(Fastly) + 3600        自建、强制代理/直连、AI、交易所、SG 金融
;  testingcf.jsdelivr.net(Cloudflare) + 28800  其余公共规则
;  ⚠ 不要写 raw.githubusercontent.com —— OpenClash 的「Github 加速地址」设置会把它
;    改写成 fastly.jsdelivr.net/gh/...@refs/heads/main，与 CI purge 用的 @main
;    不是同一个缓存键，导致 purge 长期无效（源码见 yml_rules_change.sh:295）
;  jsdelivr 强制刷新：https://purge.jsdelivr.net/gh/MAXLYEN/Openclash-Rule@main/rules/文件名.list

[custom]
;══════ ① 内网直连 ══════
ruleset=Global Direct,[]GEOSITE,private
ruleset=Global Direct,[]GEOIP,private,no-resolve

;══════ ② 自建服务 ══════
;必须先于所有公共规则集；默认直连，域名被墙时面板切代理即可
;注意：SelfHosted_Domain.yaml 目前为空(payload: [])，实际域名写在
;      /etc/openclash/custom/openclash_custom_overwrite.sh，注入点决定真实生效位置
ruleset=Self-Hosted,clash-classic:https://fastly.jsdelivr.net/gh/MAXLYEN/Openclash-Rule@main/rules/yaml/SelfHosted_Domain.yaml,3600

;══════ ③ 强制代理 / 强制直连 ══════
;语义即"无条件"，放在这里就是要压过后面所有平台与地区规则
ruleset=Proxy,clash-classic:https://fastly.jsdelivr.net/gh/MAXLYEN/Openclash-Rule@main/rules/yaml/Custom_Proxy_Domain.yaml,3600
ruleset=Custom-Made,clash-classic:https://fastly.jsdelivr.net/gh/MAXLYEN/Openclash-Rule@main/rules/yaml/Custom-Made_Domain.yaml,3600
ruleset=Global Direct,clash-classic:https://fastly.jsdelivr.net/gh/MAXLYEN/Openclash-Rule@main/rules/yaml/Custom_Direct_Domain.yaml,3600

;══════ ④ 拦截 ══════
