;  2. 路由器实测：订阅地址加 |tag:家宽,<家宽链接> 后，确认当前转换后端支持 !!GROUPID= / !!GROUP=
;     （不支持时这些池会变空，机场池会被塞 DIRECT）。家宽链接失效时 subconverter 默认整次转换返回 400，会连累机场订阅
;  3. 机场池、Auto-Test、锚点末尾的 .* 加 !!GROUPID=0!! 前缀；每个锚点在节点池之后加对应的 []🏠 XX Home 作为第 2 候选
;  4. 取消下面以及 ③ 区末尾、IP 区里 Residential 相关行的注释；空规则集登记进 validate_ini.py 的 INTENTIONALLY_EMPTY
;  5. 升版本号、记 CHANGELOG，docs/architecture.md 补上 Residential
