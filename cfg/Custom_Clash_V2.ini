;━━━━━━ 家宽方案（未启用，整段注释）━━━━━━
;用途：只能走真家宽（住宅宽带 IP）的平台。2026-10-06 设计；当时 Muse AI 经验证改走 USAlt 即可，故暂不启用
;设计要点：
;  · 家宽节点按订阅来源区分，不按节点名猜：OpenClash 订阅地址写成「机场订阅|tag:家宽,家宽链接」，
;    subconverter 给家宽链接的节点打上分组「家宽」，家宽池用 !!GROUP=家宽 只取这些节点
;  · 机场池要排除家宽节点，否则带国家字样的家宽节点会被机场池收走、被日常流量消耗（家宽多按流量计费）：
;    启用时在上面 8 个机场池与 Auto-Test 的正则前加 !!GROUPID=0!!（只取第 1 个订阅链接），锚点末尾的 .* 同样改成 !!GROUPID=0!!.*
;    （v2.23 起 🇩🇪 DE 池停用，机场池剩 7 个）
;  · 家宽池末尾带 []REJECT：没有家宽节点时组内只剩 REJECT，平台直接打不开，不会被 subconverter 塞 DIRECT 悄悄直连
;  · Residential 组只放家宽池 + REJECT，不放任何机场锚点与 Global Direct：家宽不可用时宁可断网也不换出口
;  · 买家宽前先查 ASN：应为 Comcast / Charter / Verizon / AT&T 等家庭宽带；NTT、Cogent 等骨干网转租的「ISP 住宅」
;    与常用美国节点同类，Meta 等平台会同样降级
;启用步骤：
