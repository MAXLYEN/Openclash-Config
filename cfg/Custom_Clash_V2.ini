;设置规则标志位结束

;设置分组标志位
;━━━━━━ Layer 1：地区锚点组 ━━━━━━
;第一候选恒为对应节点池 → 全新配置/丢失选择记录时自动落在正确地区
;锚点之间不互相引用（避免 Clash 循环引用），需要临时救急时用 Auto-Test 或末尾的 .* 指定具体节点
;Proxy 是通用代理（GFW 兜底、强制代理、FINAL 默认），默认香港池；平台组里的「香港」候选也写 Proxy
custom_proxy_group=Proxy`select`[]🇭🇰 HK Node`[]Auto-Test`[]Global Direct`.*
;HKNet 只承载香港本地（HK_Domain / HK_IP / HK-wifi-call），与 Proxy 分开：Proxy 换出口时它仍走香港
custom_proxy_group=HKNet`select`[]🇭🇰 HK Node`[]Auto-Test`[]Global Direct`.*
custom_proxy_group=USNet`select`[]🇺🇸 US Node`[]Auto-Test`[]Global Direct`.*
custom_proxy_group=JPNet`select`[]🇯🇵 JP Node`[]Auto-Test`[]Global Direct`.*
custom_proxy_group=SGNet`select`[]🇸🇬 SG Node`[]Auto-Test`[]Global Direct`.*
custom_proxy_group=UKNet`select`[]🇬🇧 UK Node`[]Auto-Test`[]Global Direct`.*
;【EU 并入 UK v2.23】custom_proxy_group=EUNet`select`[]🇩🇪 DE Node`[]Auto-Test`[]Global Direct`.*
;EUNet 默认英国池（v2.23 起）：欧洲规则走英国；要走欧洲时在面板里从末尾 .* 选具体节点
custom_proxy_group=EUNet`select`[]🇬🇧 UK Node`[]Auto-Test`[]Global Direct`.*
custom_proxy_group=AUNet`select`[]🇦🇺 AU Node`[]Auto-Test`[]Global Direct`.*
custom_proxy_group=BRNet`select`[]🇧🇷 BR Node`[]Auto-Test`[]Global Direct`.*
;美国备用出口：只给 USAlt_Domain / USAlt_IP 里的平台用，日常美国流量仍走 USNet
;第一候选 🇺🇸 US Alt（RackNerd 优先、挂了自动退回常用美国池）；第二候选 🇺🇸 US Node 便于面板手动切回
custom_proxy_group=USAlt`select`[]🇺🇸 US Alt`[]🇺🇸 US Node`[]Auto-Test`[]Global Direct`.*
custom_proxy_group=Auto-Test`url-test`.*`http://cp.cloudflare.com/generate_204`300,,50

;━━━━━━ Layer 2：平台组 ━━━━━━
;候选只放锚点组，第一个 = 该平台默认地区。末尾保留 .* 供流媒体解锁时钉死具体节点
;USNet 与 USAlt 同时出现（v2.22 起，用户 2026-10-11 指定）：凡能选 USNet 的平台组（含用户自定义组）都必须也能选 USAlt，
;USAlt 紧跟 USNet；validate_ini.py 的 PAIRED_GROUPS 强制检查。节点池与地区锚点组不在此列
;v2.23 起平台组不再放 EUNet 候选（EUNet 默认即英国池，与 UKNet 重复），要英国出口选 UKNet
;Netflix（默认日本），保留手动切换地区的候选
;【EU 并入 UK v2.23】custom_proxy_group=Netflix`select`[]JPNet`[]Proxy`[]USNet`[]USAlt`[]SGNet`[]UKNet`[]EUNet`[]AUNet`[]BRNet`[]Auto-Test
