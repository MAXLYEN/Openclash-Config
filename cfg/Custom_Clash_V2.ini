;Openclash-Config
;VERSION: 2.23 (2026-10-25)
;规则库：https://github.com/MAXLYEN/Openclash-Rule
;变更记录见本项目 CHANGELOG.md
;
;【三层架构】
;  Layer 0 节点池(url-test)  🇭🇰/🇯🇵/🇸🇬/🇺🇸/🇬🇧/🇩🇪/🇦🇺/🇧🇷  ← 唯一跟机场节点名打交道的一层
;                            （v2.23 起 🇩🇪 DE 池注释停用）
;  Layer 1 地区锚点(select)  Proxy(HK) HKNet USNet JPNet SGNet UKNet EUNet AUNet BRNet，另有 USAlt（美国备用出口）
;                            第一候选恒为对应节点池，全新配置无需手选
;  Layer 2 平台组(select)    候选只放锚点组，第一个 = 该平台默认地区
;  改一个地区的出口只需动 Layer 1；平台组不碰具体节点
;
;【地区意图】
;  Proxy=通用代理(默认香港池；GFW 兜底、强制代理、FINAL)  HKNet=香港本地(香港站点、香港 Wi-Fi 通话)
;  USNet=美国(美区服务)  SGNet=新加坡(亚洲金融/虚拟币)
;  JPNet=日本(含无专用节点地区的挂靠，如菲律宾)  UKNet=英国(仅本地服务)  EUNet=欧洲
;  （v2.23 起 EUNet 默认英国池，见下方【EU 并入 UK v2.23】）
;  AUNet=大洋洲  BRNet=南美
;  USAlt=美国备用出口(常用美国节点被平台降级时改走的节点，如 Meta AI；平时美国流量仍走 USNet)
;【家宽方案】已写好但整段注释、未启用，启用步骤见 Layer 0 末尾「家宽方案」段
;【临时合并 v2.20】为减少代理组，部分平台组临时合并：原行以「;【临时合并 v2.20】」前缀注释保留，紧随其后的是临时行。
;  改回：删掉临时行、去掉原行前缀即可。合并对象：AI 六组 → AI；Crypto.com/OKX/Binance → Cryptocurrency；
;  Nvidia → USNet；Bahamut / Apple TV+ → Global TV。规则 1b 本身未改，见 docs/design-notes.md 第二节「临时例外」
;【EU 并入 UK v2.23】欧洲规则（EUNet_Domain / EUNet_IP / BybitEU_Domain）默认走英国（用户 2026-10-25 指定）：
;  EUNet 锚点第一候选改为 🇬🇧 UK Node，🇩🇪 DE Node 池与 🏠 DE Home 注释停用，平台组（含 Custom-Made）去掉 EUNet 候选。
;  原行以「;【EU 并入 UK v2.23】」前缀注释保留，紧随其后的是新行。要走欧洲：面板里 EUNet 从末尾 .* 选具体欧洲节点
;  改回：删掉新行、去掉原行前缀即可
;
;【规则顺序】从上到下遍历，命中即止
;  总原则：平台维度在前，地区维度在后，ccTLD 与 gfw/cn 兜底垫底
;  地区文件(US/SG/UK/EUNet/JP/HK)一律排在平台专属之后，否则会吃掉平台组
;【GeoSite/GeoIP】平台类排在同组 .list 之后，仅作兜底补漏
;【分工】本文件只决定规则顺序与引用哪些规则集；域名 / IP 等规则内容一律放 Openclash-Rule，
;  不写 []DOMAIN / []IP-CIDR 等内联内容规则（validate_ini.py 拦截），[] 只用于 GEOSITE / GEOIP / FINAL
;【规则源】全部走自建反代 https://cf.210723.xyz/gh/...，统一 interval 3600
;  上游是 fastly.jsdelivr.net，路径 1:1 透传，nginx 不做改写也不做缓存
;  这样规则的送达延迟只剩「fastly（CI 会 purge）」+「interval 1 小时」两层，
;  不再受 testingcf 那层 Cloudflare 12 小时缓存的影响
;  ⚠ 不要写 raw.githubusercontent.com —— OpenClash 的「Github 加速地址」设置会把它
;    改写成 fastly.jsdelivr.net/gh/...@refs/heads/main，与 CI purge 的 @main 不是同一个键
[custom]
;══════ ① 内网直连 ══════
ruleset=Global Direct,[]GEOSITE,private
ruleset=Global Direct,[]GEOIP,private,no-resolve

;══════ ② 自建服务 ══════
;必须先于所有公共规则集；默认直连，域名被墙时面板切代理即可
;注意：SelfHosted_Domain.yaml 目前为空(payload: [])，实际域名写在
;      /etc/openclash/custom/openclash_custom_overwrite.sh，注入点决定真实生效位置
ruleset=Self-Hosted,clash-classic:https://cf.210723.xyz/gh/MAXLYEN/Openclash-Rule@main/rules/yaml/SelfHosted_Domain.yaml,3600

;══════ ③ 强制代理 / 强制直连 ══════
;语义即"无条件"，放在这里就是要压过后面所有平台与地区规则
ruleset=Proxy,clash-classic:https://cf.210723.xyz/gh/MAXLYEN/Openclash-Rule@main/rules/yaml/Custom_Proxy_Domain.yaml,3600
ruleset=Custom-Made,clash-classic:https://cf.210723.xyz/gh/MAXLYEN/Openclash-Rule@main/rules/yaml/Custom-Made_Domain.yaml,3600
ruleset=Global Direct,clash-classic:https://cf.210723.xyz/gh/MAXLYEN/Openclash-Rule@main/rules/yaml/Custom_Direct_Domain.yaml,3600
;── 出口覆盖：以下名单按「出口要求」归类而非按平台，必须早于所有平台与地区规则 ──
;家宽专用（未启用）：只能走真家宽的平台。启用步骤见 Layer 0 末尾「家宽方案」段
;ruleset=Residential,clash-classic:https://cf.210723.xyz/gh/MAXLYEN/Openclash-Rule@main/rules/yaml/Residential_Domain.yaml,3600
;美国备用出口：常用美国节点被平台降级、需要换节点的平台（2026-10-06 首批 Meta AI）
;常用节点属 AS2914 NTT 段，Meta 只给 1 个模型、dev.meta.ai 跳 /unavailable?reason=geo；
;RackNerd（AS36352）返回全部模型。两者 ipinfo 都是 US 洛杉矶，差别在 IP 类型 / 信誉而非地区
ruleset=USAlt,clash-classic:https://cf.210723.xyz/gh/MAXLYEN/Openclash-Rule@main/rules/yaml/USAlt_Domain.yaml,3600

;══════ ④ 拦截 ══════
