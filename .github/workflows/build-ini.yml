name: Build config

# 仅在手动维护的 cfg/ 变化时触发。
# 产物提交到 dist/，该路径不在触发范围内，不会循环触发。
on:
  push:
    branches: [main]
    paths:
      - 'cfg/**'
      - 'scripts/**'
      - '.github/workflows/build-ini.yml'
  workflow_dispatch:
  # 由 Openclash-Rule 构建完成后触发：规则库改了文件名或目录结构时，
  # 本仓库不会有任何 push，只有这条通知能立刻发现引用断裂
  repository_dispatch:
    types: [rules-updated]
  schedule:
    # 每周一 03:00 UTC 跑一次联网校验：规则库那边删文件或改结构时，
    # 配置这边不会有任何 push，只能靠定时任务发现
    - cron: '0 3 * * 1'

permissions:
  contents: write

concurrency:
  group: build-config
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # 校验在构建之前：结构有错就不要产出，避免把坏配置推到 dist/
      - name: 校验配置结构
        run: python3 scripts/validate_ini.py

      - name: 规范化 cfg 并生成 dist
        run: python3 scripts/build_ini.py

      - name: 联网校验规则源
        # push 触发时失败不阻断提交 —— 规则源不可达是对方仓库的问题，
        # 不应该卡住本仓库的配置发布。
        # 但由 Openclash-Rule 的 repository_dispatch 或定时任务触发时必须报错，
        # 这两种场景的唯一目的就是发现引用断裂。
        # --strict-empty：规则集被去重流程清空时同样报错，而不是只告警。
        continue-on-error: ${{ github.event_name == 'push' }}
        run: python3 scripts/validate_ini.py --online --strict-empty

      - name: 提交产物
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cfg dist
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          COUNT=$(git diff --cached --name-only | wc -l)
          CHANGED_INI=$(git diff --cached --name-only -- 'dist/*.ini')
          git commit -m "chore: 重新生成配置产物（${COUNT} 个文件）" -m "来源提交 ${GITHUB_SHA::7}"
          # 构建期间 main 可能被推进（例如只改 docs/ 的推送，它不触发本 workflow，
          # 不受 concurrency 保护），直接 push 会被拒。先 rebase 再重试。
          PUSHED=0
          for i in 1 2 3; do
            if git push; then PUSHED=1; break; fi
            echo "推送被拒，rebase 后重试（第 ${i} 次）"
            git pull --rebase origin main
          done
          [ "$PUSHED" = 1 ] || exit 1
          # 清除 jsdelivr 缓存，让 README 里的 fastly 镜像地址立即拿到新配置。
          # 只清 fastly 这一层；testingcf 前面的 Cloudflare 缓存清不到（见 docs/design-notes.md）。
          # 清缓存失败不影响发布，只影响镜像地址的新鲜度。
          for f in $CHANGED_INI; do
            if curl -fsS --max-time 20 -o /dev/null "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/${f}"; then
              echo "已清缓存：${f}"
            else
              echo "::warning::清缓存失败：${f}"
            fi
          done
