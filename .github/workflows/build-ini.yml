name: Build config

# 仅在手动维护的 cfg/ 变化时触发。
# 产物提交到 dist/，该路径不在触发范围内，不会循环触发。
on:
  push:
    branches: [main]
    paths:
      - 'cfg/**'
      - 'scripts/**'
      - '.github/workflows/build-ini.yml'
  workflow_dispatch:
  # 由 Openclash-Rule 构建完成后触发：规则库改了文件名或目录结构时，
  # 本仓库不会有任何 push，只有这条通知能立刻发现引用断裂
  repository_dispatch:
    types: [rules-updated]
  schedule:
    # 每周一 03:00 UTC 跑一次联网校验：规则库那边删文件或改结构时，
    # 配置这边不会有任何 push，只能靠定时任务发现
    - cron: '0 3 * * 1'

permissions:
  contents: write

concurrency:
  group: build-config
  cancel-in-progress: true

jobs:
  build:
    # 固定版本：ubuntu-latest 自 2026-10-19 起迁移到 Ubuntu 26，避免运行环境悄悄变化
    runs-on: ubuntu-24.04
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # 校验在构建之前：结构有错就不要产出，避免把坏配置推到 dist/
      - name: 校验配置结构
        run: python3 scripts/validate_ini.py

      - name: 规范化 cfg 并生成 dist
        run: python3 scripts/build_ini.py

      - name: 联网校验规则源
        # push 触发时失败不阻断提交 —— 规则源不可达是对方仓库的问题，
        # 不应该卡住本仓库的配置发布。
        # 但由 Openclash-Rule 的 repository_dispatch 或定时任务触发时必须报错，
        # 这两种场景的唯一目的就是发现引用断裂。
        # --strict-empty：规则集被去重流程清空时同样报错，而不是只告警。
        # --rule-ref：rules-updated 通知在规则库推送后约 10 秒到达，而自建镜像约 5 分钟
        # 才同步一次，读镜像只能拿到旧文件（删文件、改名都会漏过）。
        # 因此按通知里的提交号（规则库含 yaml 产物的那次提交）直接读取。
        # push 与定时任务不带该参数，校验的仍是镜像本身的真实可用性。
        continue-on-error: ${{ github.event_name == 'push' }}
        env:
          RULE_SHA: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.sha || '' }}
        run: |
          REF_ARG=()
          if [ -n "$RULE_SHA" ]; then
            # 通知内容来自外部请求，先校验格式再拼进参数与 URL
            if ! [[ "$RULE_SHA" =~ ^[0-9a-f]{7,40}$ ]]; then
              echo "::error::rules-updated 通知里的 sha 格式不对：${RULE_SHA:0:80}"
              exit 1
            fi
            echo "按 Openclash-Rule 提交 ${RULE_SHA} 校验"
            REF_ARG=(--rule-ref "$RULE_SHA")
          fi
          python3 scripts/validate_ini.py --online --strict-empty "${REF_ARG[@]}"

      - name: 提交产物
        # /tmp/pushed 标记「本地 HEAD 已在远端」，供后续步骤判断：
        # 无变化时 HEAD 就是 GITHUB_SHA，本来就在远端；推送成功后同理。
        # 推送失败时不写 —— 本地 HEAD 不在远端，Rule 按提交号读 raw 会 404。
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cfg dist
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            echo ok > /tmp/pushed
            exit 0
          fi
          COUNT=$(git diff --cached --name-only | wc -l)
          git commit -m "chore: 重新生成配置产物（${COUNT} 个文件）" -m "来源提交 ${GITHUB_SHA::7}"
          # 构建期间 main 可能被推进（例如只改 docs/ 的推送，它不触发本 workflow，
          # 不受 concurrency 保护），直接 push 会被拒。先 rebase 再重试；
          # rebase 冲突时中止并放弃重试，不留下半截 rebase 状态。
          PUSHED=0
          for i in 1 2 3; do
            if git push; then PUSHED=1; break; fi
            echo "推送被拒，rebase 后重试（第 ${i} 次）"
            git pull --rebase origin main || { git rebase --abort; break; }
          done
          [ "$PUSHED" = 1 ] || exit 1
          echo ok > /tmp/pushed

      - name: 比对远端 dist 变化
        # 清缓存与通知 Openclash-Rule 都以「本次运行前后，远端 main 上的 dist/*.ini
        # 是否变化」为准，而不是 bot 自己的提交里有没有它：改配置时，会话通常在本地
        # 跑过 build_ini.py，把 cfg/ 与 dist/ 一起推上来，bot 随后只改
        # dist/manifest.json 或无可提交。只看 bot 提交会同时漏掉两件事 ——
        # 例如 9fa077f、18782dd 自带 dist/Custom_Clash_V2.ini，其后的 bot 提交
        # 28fb5e0 / c0a4f1d 只改了 manifest，Rule 没收到通知；54baa87 自带
        # dist/Custom_Clash.ini，bot 无可提交，jsdelivr 缓存没有清。
        # 基准 BASE：push 用推送前的远端 tip（event.before）；
        # 其他触发（repository_dispatch / schedule / workflow_dispatch）用 GITHUB_SHA，
        # 此时只有 bot 提交可能改变 dist。
        # 输出 ini：有变化的 dist/*.ini，空格分隔；未推送到远端时为空。
        id: dist
        if: always()
        env:
          EVENT_BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          if [ ! -f /tmp/pushed ]; then
            echo "本地 HEAD 未推送到远端，跳过比对"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            BASE="$EVENT_BEFORE"
          else
            BASE="$GITHUB_SHA"
          fi
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ]; then
            # checkout 是浅克隆，event.before 通常不在本地；diff 只需两端的树，单独取回即可
            git cat-file -e "$BASE^{commit}" 2>/dev/null \
              || git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null || true
          fi
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            INI=$(git diff --name-only "$BASE" HEAD -- 'dist/*.ini' | tr '\n' ' ')
            echo "相对 ${BASE::7} 有变化：${INI:-无}"
          else
            # 无基准（新分支）或取不到（被强推覆盖后已不可达）：视为全部变化
            INI=$(ls dist/*.ini | tr '\n' ' ')
            echo "基准 ${BASE:-（无）} 不可用，视为全部变化：${INI}"
          fi
          echo "ini=${INI% }" >> "$GITHUB_OUTPUT"

      - name: 清除 jsdelivr 缓存
        # 让 README 里的 fastly 镜像地址立即拿到新配置。
        # 只清 fastly 这一层；testingcf 前面的 Cloudflare 缓存清不到（见 docs/design-notes.md）。
        # 清缓存失败不影响发布，只影响镜像地址的新鲜度。
        if: always() && steps.dist.outputs.ini != ''
        continue-on-error: true
        env:
          CHANGED_INI: ${{ steps.dist.outputs.ini }}
        run: |
          for f in $CHANGED_INI; do
            if curl -fsS --max-time 20 -o /dev/null "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/${f}"; then
              echo "已清缓存：${f}"
            else
              echo "::warning::清缓存失败：${f}"
            fi
          done

      - name: 通知 Openclash-Rule
        # 规则链顺序变化后，规则库的冗余分析（dedupe.yml）需要按新配置重跑。
        # 对方读取 client_payload.sha 对应提交的 dist/Custom_Clash_V2.ini，只出报告不提交；
        # 对方的 build 只在 rules/list 或 scripts 变化时触发，因此不会形成循环。
        # 是否变化由上一步「比对远端 dist 变化」判断。
        # 发送的是 HEAD：已由「提交产物」的 /tmp/pushed 确认在远端（中途 rebase 过也是推送后的提交号）。
        #
        # 需要在本仓库 Settings → Secrets and variables → Actions 添加 RULE_DISPATCH_TOKEN：
        # 一个 fine-grained PAT，仓库范围选 MAXLYEN/Openclash-Rule，
        # 权限 Contents: Read and write。GITHUB_TOKEN 无法跨仓库触发 workflow。
        if: always() && contains(format(' {0} ', steps.dist.outputs.ini), ' dist/Custom_Clash_V2.ini ')
        continue-on-error: true
        env:
          RULE_DISPATCH_TOKEN: ${{ secrets.RULE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$RULE_DISPATCH_TOKEN" ]; then
            echo "未配置 RULE_DISPATCH_TOKEN，跳过通知"
            exit 0
          fi
          SHA=$(git rev-parse HEAD)
          echo "通知提交 ${SHA}"
          curl -sS -f -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $RULE_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/MAXLYEN/Openclash-Rule/dispatches \
            -d "{\"event_type\":\"config-updated\",\"client_payload\":{\"sha\":\"${SHA}\"}}"

      - name: 检查 RULE_DISPATCH_TOKEN 有效期
        # fine-grained PAT 有有效期，过期后「通知 Openclash-Rule」会失败，但那一步
        # continue-on-error，运行仍是绿的，很容易漏看。定时任务每周检查一次：
        # token 无效或剩余不足 14 天时让运行变红（GitHub 会发邮件）。
        # 过期时间取自 API 响应头 github-authentication-token-expiration。
        # 反方向（Openclash-Rule 发来 rules-updated 用的 token）在对方仓库，需在那边做同样的检查。
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          RULE_DISPATCH_TOKEN: ${{ secrets.RULE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$RULE_DISPATCH_TOKEN" ]; then
            echo "::warning::未配置 RULE_DISPATCH_TOKEN，Openclash-Rule 收不到 config-updated 通知"
            exit 0
          fi
          HDR=$(mktemp)
          CODE=$(curl -sS -o /dev/null -D "$HDR" -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $RULE_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/MAXLYEN/Openclash-Rule)
          if [ "$CODE" != 200 ]; then
            echo "::error::RULE_DISPATCH_TOKEN 无效或已过期（HTTP ${CODE}），请重新生成并更新 Secret"
            exit 1
          fi
          EXP=$(grep -i '^github-authentication-token-expiration:' "$HDR" | cut -d' ' -f2- | tr -d '\r')
          if [ -z "$EXP" ]; then
            echo "token 有效，未设置过期时间"
            exit 0
          fi
          DAYS=$(( ( $(date -d "$EXP" +%s) - $(date +%s) ) / 86400 ))
          echo "token 有效，${EXP} 过期（剩 ${DAYS} 天）"
          if [ "$DAYS" -lt 14 ]; then
            echo "::error::RULE_DISPATCH_TOKEN 将于 ${EXP} 过期（剩 ${DAYS} 天），请提前续期"
            exit 1
          fi
